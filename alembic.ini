# ─── Alembic Configuration ───────────────────────────────────
# Canonical configuration for PBL4 PostgreSQL database schema migrations.
# Reference: 03. Mô hình dữ liệu / 01. PostgreSQL

[alembic]
# Path to migration scripts folder
script_location = migrations

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with repository root
prepend_sys_path = .

# Max length of slug part in migration filename
truncate_slug_length = 40

# Target database URL: left empty intentionally.
# The canonical database URL is loaded dynamically from the environment
# variable DATABASE_URL inside migrations/env.py.
sqlalchemy.url =

# ─── Logging Configuration ────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
